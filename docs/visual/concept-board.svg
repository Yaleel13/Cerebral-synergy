  <text x="124" y="146" fill="#E2C47C" font-size="20" letter-spacing="3">THRESHOLD HERO</text>
  <text x="124" y="210" fill="#F2EEE4" font-size="58" font-family="Georgia">Cinematic Editorial Hierarchy</text>
  <text x="124" y="272" fill="#C1B9A6" font-size="24">Discovered pathways. Archival intelligence. Mystery with comprehension.</text>
  <text x="862" y="138" fill="#9EA9C2" font-size="18" letter-spacing="2">PALETTE</text>
  <text x="862" y="172" fill="#F2EEE4" font-size="26">Obsidian / Slate / Luminous Parchment</text>
  <text x="862" y="214" fill="#C1B9A6" font-size="20">Accent: Warm brass + tempered cyan</text>
  <text x="862" y="324" fill="#9EA9C2" font-size="18" letter-spacing="2">TYPOGRAPHY</text>
  <text x="862" y="360" fill="#F2EEE4" font-size="26">Cormorant Garamond + Manrope</text>
  <text x="862" y="404" fill="#C1B9A6" font-size="20">Editorial display with readable systems copy</text>
  <text x="124" y="526" fill="#9EA9C2" font-size="18" letter-spacing="2">PORTAL IDENTITY STRIPS</text>
  <text x="124" y="566" fill="#F2EEE4" font-size="24">Archive · Laboratory · Observatory · Resonance · Gallery · Oracle</text>
  <text x="124" y="610" fill="#C1B9A6" font-size="18">Tints and symbols differentiate chambers without breaking cohesion.</text>
  <text x="124" y="732" fill="#9EA9C2" font-size="18" letter-spacing="2">MOTION & INTERACTION</text>
  <text x="124" y="770" fill="#F2EEE4" font-size="24">Subtle rise-in, tactile hover lift, focus-first controls</text>
  <text x="124" y="814" fill="#C1B9A6" font-size="18">Reduced-motion mode collapses transitions to near-zero.</text>
  <text x="1106" y="732" fill="#9EA9C2" font-size="18" letter-spacing="2">MEDIA</text>
  <text x="1106" y="770" fill="#F2EEE4" font-size="24">Generated inscription motifs</text>
  <text x="1106" y="814" fill="#C1B9A6" font-size="18">No generic galaxy or neon-cyberpunk effects.</text>
